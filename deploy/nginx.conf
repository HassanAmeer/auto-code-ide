# AutoCode / T3 Web — Production Nginx Reverse Proxy Configuration
# Place this file in /etc/nginx/sites-available/t3forweb (or include in nginx.conf)
# and symlink to /etc/nginx/sites-enabled/t3forweb:
#   sudo ln -s /etc/nginx/sites-available/t3forweb /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# Connection header mapping for WebSocket upgrades
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream autocode_server {
    server 127.0.0.1:13774;
    keepalive 32;
}

upstream autocode_web {
    server 127.0.0.1:5734;
    keepalive 32;
}

server {
    listen 80;
    server_name _; # Replace with your VPS domain or IP (e.g. ai.example.com)

    # Security & Size Limits
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # ------------------------------------------------------------------------
    # 1. MCP / Terminal / WebSocket Routes
    # ------------------------------------------------------------------------
    location ~* ^/(mcp|terminal|ws) {
        proxy_pass http://autocode_server;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time bidirectional streaming
        proxy_buffering off;
        proxy_cache off;

        # Extended timeouts for long-running sessions
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ------------------------------------------------------------------------
    # 2. Server-Sent Events (SSE) & AI Streaming Endpoints
    # ------------------------------------------------------------------------
    location ~* ^/(api/ai-model-logs|api/events|api/agent/stream) {
        proxy_pass http://autocode_server;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Crucial for SSE: prevent Nginx from buffering the chunked stream
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Extended timeout for AI generation turns
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------------------
    # 3. Backend REST APIs & Configuration Endpoints
    # ------------------------------------------------------------------------
    location ~* ^/(api|\.well-known)/ {
        proxy_pass http://autocode_server;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for turn execution and long RPC commands
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ------------------------------------------------------------------------
    # 4. Web Frontend (Vite Dev Server or Production Static Files)
    # ------------------------------------------------------------------------
    location / {
        proxy_pass http://autocode_web;
        proxy_http_version 1.1;

        # Support Vite HMR and client websockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
